version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       inferencehub
      POSTGRES_USER:     ihub
      POSTGRES_PASSWORD: ihubpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihub -d inferencehub"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  app:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     runtime
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus:   "2"
          memory: "1G"
        reservations:
          cpus:   "0.5"
          memory: "256M"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:                  postgresql+asyncpg://ihub:ihubpass@postgres:5432/inferencehub
      REDIS_URL:                     redis://redis:6379/0
      SECRET_KEY:                    ${SECRET_KEY}
      ALGORITHM:                     HS256
      ACCESS_TOKEN_EXPIRE_MINUTES:   30
      JSON_LOGS:                     "true"
      CACHE_DEFAULT_TTL:             300
      # Worker tuning
      GUNICORN_WORKERS:              "4"
      GUNICORN_TIMEOUT:              "120"
      GUNICORN_GRACEFUL_TIMEOUT:     "30"
      GUNICORN_MAX_REQUESTS:         "1000"
      GUNICORN_LOG_LEVEL:            "info"
      PORT:                          "8000"
    volumes:
      - ./ml_models:/app/ml_models:ro
    command: >
      gunicorn main:app
      -c gunicorn.conf.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 40s

  migrate:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     runtime
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://ihub:ihubpass@postgres:5432/inferencehub
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
